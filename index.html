<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard งบประมาณ คณะเทคโนโลยี มข. 2569</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf6f0;--card:#fff;--text:#2d1a0e;--muted:#8a6a5a;--border:#e8d5c8;
  --blue:#c0392b;--green:#27ae60;--orange:#e67e22;--red:#c0392b;--purple:#8e44ad;--teal:#16a085;
  --primary:#c0392b;--primary-dark:#922b21;--primary-light:#f5b7b1;
  --cream:#fdf6f0;--cream2:#faebd7;
}
body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#8b1a1a 0%,#c0392b 55%,#e74c3c 100%);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:4px solid #7b1111}
.header h1{font-size:22px;font-weight:700;color:#fff}
.header p{font-size:14px;color:rgba(255,255,255,0.6);margin-top:2px}
.hbtn{font-family:'Sarabun',sans-serif;padding:8px 18px;border-radius:8px;border:2px solid rgba(255,255,255,0.6);background:rgba(255,255,255,0.15);color:#fff;font-size:15px;cursor:pointer;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,0.28)}
.lupd{font-size:13px;color:rgba(255,255,255,0.5);margin-right:8px}
.sdot{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block;margin-right:5px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fbar{background:#faebd7;border-bottom:2px solid #e8d5c8;padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
select.fs{font-family:'Sarabun',sans-serif;font-size:14px;padding:5px 10px;border-radius:7px;border:1px solid #d4a898;background:#fff;color:var(--text);cursor:pointer}
.fbtn{font-family:'Sarabun',sans-serif;font-size:13px;padding:5px 10px;border-radius:7px;border:1px solid #d4a898;background:#fff5f0;color:var(--primary-dark);cursor:pointer}
.cnt{font-size:13px;color:var(--primary);background:#fde8e8;padding:3px 9px;border-radius:20px;font-weight:600}
.tabs{display:flex;background:#faebd7;border-bottom:2px solid #e8d5c8;padding:0 28px}
.tab{font-family:'Sarabun',sans-serif;padding:14px 22px;font-size:15px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.main{padding:20px 28px;max-width:1500px;margin:0 auto}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.07)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.c-blue::before{background:var(--primary)}.kpi.c-green::before{background:var(--green)}
.kpi.c-orange::before{background:var(--orange)}.kpi.c-purple::before{background:var(--purple)}
.kpi.c-red::before{background:var(--red)}.kpi.c-teal::before{background:var(--teal)}
.kpi-lbl{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.kpi-v{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.kpi-s{font-size:12px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px}
.pg{background:#d1fae5;color:#065f46}.pw{background:#fef3c7;color:#92400e}.pr{background:#fee2e2;color:#991b1b}
.card{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid var(--border);margin-bottom:14px;box-shadow:0 1px 4px rgba(192,57,43,0.06)}
.card-hd{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-hd::before{content:'';width:4px;height:15px;border-radius:2px;background:var(--primary);display:block;flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
/* Division cards */
.div-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.div-card{border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;border:1px solid}
.div-card-name{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.div-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:700}
.div-nums{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.div-num{font-size:11px}.div-num-lbl{opacity:.7;display:block;margin-bottom:1px;font-size:12px}.div-num-val{font-size:16px;font-weight:700}
.div-prog{height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,0.4);margin-bottom:4px}
.div-prog-fill{height:100%;border-radius:4px}
.div-pct{font-size:13px;font-weight:700;text-align:right}
/* Project cards */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
@media(max-width:700px){.proj-grid{grid-template-columns:1fr}}
.pc{background:#fff;border-radius:12px;border:1px solid var(--border);padding:14px 16px;border-left:4px solid;transition:box-shadow .15s;cursor:pointer}
.pc:hover{box-shadow:0 4px 14px rgba(0,0,0,0.09)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.pc-code{font-size:16px;font-weight:800;color:var(--primary)}
.pc-tier{font-size:12px;padding:2px 7px;border-radius:10px;font-weight:700;flex-shrink:0}
.t1{background:#ede9fe;color:#5b21b6}.t2{background:#dbeafe;color:#1e40af}.tp{background:#d1fae5;color:#065f46}
.pc-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:2px}
.pc-owner{font-size:12px;color:var(--muted);margin-bottom:8px}
.pc-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.pc-box{background:#f9fafb;border-radius:7px;padding:6px 8px;font-size:10px}
.pc-box-lbl{color:var(--muted);display:block;margin-bottom:2px;font-size:12px}.pc-box-val{font-size:15px;font-weight:700}
.prog{height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:100%;border-radius:5px;transition:width .5s}
.prog-pct{font-size:13px;font-weight:700;text-align:right}
.pc-divs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6}
.dchip{font-size:11px;padding:2px 6px;border-radius:6px;font-weight:600;cursor:pointer;transition:opacity .15s}
.dchip:hover{opacity:.75}
/* Detail Panel */
.detail-panel{display:none;position:fixed;top:0;right:0;width:720px;height:100vh;background:#fffaf7;border-left:3px solid var(--primary);box-shadow:-8px 0 32px rgba(0,0,0,0.12);z-index:1000;overflow-y:auto;flex-direction:column}
.detail-panel.open{display:flex}
.dp-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.dp-title{font-size:16px;font-weight:700;color:var(--text)}
.dp-actions{display:flex;align-items:center;gap:8px}
.dp-close{font-size:18px;cursor:pointer;color:var(--muted);background:#f3f4f6;border:none;font-family:'Sarabun',sans-serif;padding:4px 8px;border-radius:6px}
.dp-close:hover{background:var(--border)}
.dp-body{padding:16px 20px;flex:1}
.dp-code{font-size:22px;font-weight:800;color:var(--primary);margin-bottom:3px}
.dp-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.4}
.dp-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.dp-kpi{background:#f9fafb;border-radius:8px;padding:10px 12px;text-align:center}
.dp-kpi-lbl{font-size:12px;color:var(--muted);margin-bottom:3px}.dp-kpi-val{font-size:18px;font-weight:700}
.dp-section{margin-bottom:14px}
.dp-sec-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between}
/* Div filter tabs in panel */
.dp-div-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dp-div-tab{font-family:'Sarabun',sans-serif;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid;cursor:pointer;font-weight:600;transition:all .15s}
.dp-div-tab.active{color:#fff!important;border-color:transparent!important}
.dp-div-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px 10px;background:#f9fafb;border-radius:8px;cursor:pointer;transition:all .15s}
.dp-div-row:hover{background:#f0f9ff;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.dp-div-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dp-div-name{font-size:14px;font-weight:600;flex:1}
.dp-div-bar{flex:2;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.dp-div-fill{height:100%;border-radius:4px}
.dp-div-pct{font-size:13px;font-weight:700;min-width:35px;text-align:right}
.dp-div-amt{font-size:12px;color:var(--muted);text-align:right;min-width:90px}
.dp-div-arrow{font-size:12px;color:var(--muted)}
/* TX table */
.tx-filter{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tx-filter-label{font-size:11px;color:var(--muted);font-weight:600}
.tx-div-btn{font-family:'Sarabun',sans-serif;font-size:10px;padding:3px 8px;border-radius:12px;border:1px solid;cursor:pointer;font-weight:600;transition:all .15s}
.tx-div-btn.active{color:#fff!important;border-color:transparent!important}
.tx-table{width:100%;border-collapse:collapse;font-size:13px}
.tx-table th{background:#f9fafb;padding:8px 10px;text-align:left;font-weight:700;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.tx-table td{padding:6px 8px;border-bottom:1px solid #f9fafb;vertical-align:top}
.tx-table tr:hover td{background:#fafafa}
.tx-date{color:var(--muted);white-space:nowrap;font-size:12px}
.tx-desc{color:var(--text);line-height:1.3}
.tx-div-badge{font-size:11px;padding:2px 6px;border-radius:5px;font-weight:700;white-space:nowrap;display:inline-block}
.tx-amt{font-weight:700;text-align:right!important;white-space:nowrap;color:var(--green)}
.tx-total-row td{font-weight:700;background:#fde8e8;color:var(--primary-dark);border-top:2px solid var(--primary-light)}
/* Tables */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt th{font-weight:700;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:2px solid var(--border);font-size:13px;white-space:nowrap}
table.dt th:first-child{text-align:left}
table.dt td{padding:9px 12px;border-bottom:1px solid #f9fafb;text-align:right}
table.dt td:first-child{text-align:left;font-weight:600}
table.dt tr:hover td{background:#fafafa}
.tr-sum td{font-weight:700;background:#fde8e8;border-top:2px solid var(--primary-light);color:var(--primary-dark)}
.chart-wrap{position:relative;width:100%}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:999}
.overlay.open{display:block}
.loading{text-align:center;padding:50px;color:var(--muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px;color:#991b1b;font-size:14px;margin-bottom:14px}
.no-data{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.footer{text-align:center;padding:14px;color:var(--muted);font-size:13px;border-top:2px solid var(--primary-light);background:var(--cream2)}
</style>
</head>

let rawRows=[];let opRows=[];let opTotal=0;let projActual={};let allTx=[];let charts={};let activeTab=0;

// แก้ปัญหาตัวเลขมี comma ต่อท้าย เช่น "415.00,3" → 415
function parseNum(v){
  if(v===null||v===undefined||v==='')return 0;
  const s=v.toString().trim();
  // ดึงเฉพาะตัวเลขและจุดทศนิยม
  const m=s.match(/^[\d,]+(\.\d+)?/);
  if(!m)return 0;
  return parseFloat(m[0].replace(/,/g,''))||0;
}
function fmt(v){if(!v||isNaN(v))return'0';if(Math.abs(v)>=1e6)return(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return(v/1e3).toFixed(0)+'K';return Math.round(v).toLocaleString('th-TH');}
function fmtF(v){return v?Math.round(v).toLocaleString('th-TH'):'0';}
function pct(a,b){return b>0?Math.min(Math.round(a/b*100),999):0;}
function pctCls(p){return p>=80?'pr':p>=50?'pw':'pg';}
function pctClr(p){return p>=80?'#dc2626':p>=50?'#d97706':'#059669';}
function kc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
const mNames=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function mkLbl(mk){const[y,m]=mk.split('-');return mNames[parseInt(m)-1];}

function switchTab(i,el){activeTab=i;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderAll();}

function renderOpBudget(kpiHtml){
  const rows=opRows.slice(1).filter(r=>r[0]&&r[0].trim());
  const disbRows=rows.filter(r=>parseNum(r[9])>0);

  // col: A=0(หมวด), B=1(สังกัด), F=5(รายละเอียด), H=7(เจ้าของ), J=9(เบิก)

  // รวมตามสังกัด (col B)
  const byDiv={};
  disbRows.forEach(r=>{
    const div=(r[1]||'').trim();
    if(!div||!VALID_DIVS.has(div))return;
    if(!byDiv[div])byDiv[div]={disb:0,txs:[]};
    byDiv[div].disb+=parseNum(r[9]);
    byDiv[div].txs.push(r);
  });
  const divEntries=Object.entries(byDiv).sort((a,b)=>b[1].disb-a[1].disb);
  const maxDiv=divEntries.length?divEntries[0][1].disb:1;

  // รวมตามหมวด (col A)
  const byCat={};
  disbRows.forEach(r=>{
    const cat=(r[0]||'อื่นๆ').trim()||'อื่นๆ';
    if(!byCat[cat])byCat[cat]=0;
    byCat[cat]+=parseNum(r[9]);
  });
  const catEntries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=catEntries.length?catEntries[0][1]:1;

  // รายเดือน
  const byMonth={};
  disbRows.forEach(r=>{

function buildCodeFilter(){
  const fc=document.getElementById('fCode');if(!fc)return;const cur=fc.value;
  fc.innerHTML='<option value="">&#8212; ทุกโครงการ &#8212;</option>';
  BUDGET_DATA.forEach(p=>{const o=document.createElement('option');o.value=p.code;o.textContent=p.code+' - '+(p.name.length>28?p.name.slice(0,28)+'…':p.name);fc.appendChild(o);});
  if(cur)fc.value=cur;
}
function clearFilters(){['fCode','fDiv','fAlert','fSort'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=(id==='fSort'?'code':'');});applyFilter();}
function applyFilter(){renderAll();}

function parseCSV(txt){
  return txt.split('\n').map(l=>{
    const c=[];let cur='';let inQ=false;
    for(let i=0;i<l.length;i++){
      if(l[i]==='"'){inQ=!inQ;}else if(l[i]===','&&!inQ){c.push(cur.trim());cur='';}else cur+=l[i];
    }
    c.push(cur.trim());return c;
  }).filter(r=>r.length>1);
}

async function loadSheets(){
  document.getElementById('lupd').textContent='กำลังโหลด...';
  try{
    const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID+'&t='+Date.now();
    const urlOp='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID_OP+'&t='+Date.now();
    const [r, rOp]=await Promise.all([fetch(url),fetch(urlOp)]);
    if(!r.ok)throw new Error('HTTP '+r.status);
    rawRows=parseCSV(await r.text());
    opRows=rOp.ok?parseCSV(await rOp.text()):[];
    projActual={};allTx=[];
    rawRows.slice(1).forEach(row=>{
      if(!row[0]||!row[0].trim())return;
      // ดึงรหัส 6 หลักจาก col A (เช่น "121131ซ่อมแซมครุภัณฑ์" -> "121131")
      const rawFull=row[0].trim();
      const codeMatch=rawFull.match(/^(\d{6})/);
      if(!codeMatch)return;
      const rawCode=codeMatch[1];
      const div=(row[2]||'').trim();
      if(div&&!VALID_DIVS.has(div))return; // กรอง div ที่ไม่ใช่สาขาจริง
      const disb=parseNum(row[10]);  // คอลัมน์ K = ยอดเบิกจริง
      const appr=parseNum(row[9]);   // คอลัมน์ J = ยอดขออนุมัติ
      if(disb<0||disb>10000000)return; // กรองค่าผิดปกติ
      if(appr<0||appr>50000000)return;
      // ใช้ยอด "เบิก" ถ้ามี ไม่งั้นใช้ยอด "ขออนุมัติ"
      const amt=disb>0?disb:appr;
      if(amt<=0)return; // ข้ามรายการที่ไม่มีทั้งสองค่า
      // วันที่: ถ้าเบิกแล้วใช้วันที่เบิก (col L) ไม่งั้นใช้วันที่บันทึก (col F)
      const dtRaw=disb>0?(row[11]||row[5]||''):(row[5]||'');
      const dt=new Date(dtRaw);
      const dateStr=!isNaN(dt)&&dt.getFullYear()>2000?dt.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'}):'';
      const monthKey=!isNaN(dt)&&dt.getFullYear()>2000?dt.getFullYear()+'-'+(dt.getMonth()+1).toString().padStart(2,'0'):'';
      const status=disb>0?'เบิกแล้ว':appr>0?'อนุมัติแล้ว':'';
      if(!projActual[rawCode])projActual[rawCode]={total:0,appr:0,divs:{},months:{}};
      projActual[rawCode].total+=disb; // total = เบิกจริงเท่านั้น
      projActual[rawCode].appr+=appr;
      if(div){
        if(!projActual[rawCode].divs[div])projActual[rawCode].divs[div]={disb:0,appr:0,txs:[]};
        projActual[rawCode].divs[div].disb+=disb;
        projActual[rawCode].divs[div].appr+=appr;
      }
      if(monthKey&&disb>0){
        if(!projActual[rawCode].months[monthKey])projActual[rawCode].months[monthKey]=0;
        projActual[rawCode].months[monthKey]+=disb;
      }
      // เก็บเฉพาะรายการที่เบิกจ่ายแล้ว
      if(disb>0){
        const tx={code:rawCode,div,disb,appr,amt:disb,date:dateStr,monthKey,desc:(row[6]||'').replace(/"/g,'').trim(),owner:(row[8]||'').trim()};
        allTx.push(tx);
        if(div&&projActual[rawCode].divs[div]){
          projActual[rawCode].divs[div].txs.push(tx);
        }
      }
    });
    document.getElementById('lupd').textContent='อัพเดต '+new Date().toLocaleTimeString('th-TH');
    // รวมยอดเบิกจ่าย งบดำเนินงาน (col J = index 9)
    opTotal=0;
    opRows.slice(1).forEach(r=>{
      if(!r[0]||!r[0].trim())return;
      opTotal+=parseNum(r[9]);
    });
    buildCodeFilter();renderAll();
  }catch(e){
    document.getElementById('lupd').textContent='โหลดไม่สำเร็จ';
    document.getElementById('app').innerHTML='<div class="err"><strong>โหลดไม่สำเร็จ:</strong> '+e.message+'</div>';
  }
}

function getFilteredData(){
  // ไม่มี global filter แล้ว — แต่ละหน้ากรองเอง
  let data=BUDGET_DATA.map(p=>{
    const act=projActual[p.code]||{total:0,appr:0,divs:{},months:{}};
    return{...p,showBudget:p.budget,showActual:act.total,usePct:pct(act.total,p.budget),divsActual:act.divs,months:act.months};
  });
  data.sort((a,b)=>a.code.localeCompare(b.code));
  return data;
}

function renderAll(){
  const data=getFilteredData();
  const totalB=data.reduce((s,p)=>s+p.showBudget,0);
  const totalA=data.reduce((s,p)=>s+p.showActual,0);
  const over80=data.filter(p=>p.usePct>=80).length;
  const under20=data.filter(p=>p.usePct<20&&p.showBudget>0).length;
  const totalP=pct(totalA,totalB);
  // cnt-badge removed with filter bar
  const kpiHtml=`<div class="kpi-row">
    <div class="kpi c-blue"><div class="kpi-lbl">งบตั้งไว้รวม</div><div class="kpi-v">${fmt(totalB)}</div><div class="kpi-s">${fmtF(totalB)} บาท</div></div>
    <div class="kpi c-green"><div class="kpi-lbl">เบิกจ่ายแล้ว</div><div class="kpi-v">${fmt(totalA)}</div><span class="pill ${pctCls(totalP)}">${totalP}% ของงบ</span></div>
    <div class="kpi c-orange"><div class="kpi-lbl">คงเหลือ</div><div class="kpi-v">${fmt(totalB-totalA)}</div><div class="kpi-s">${fmtF(totalB-totalA)} บาท</div></div>
    <div class="kpi c-red"><div class="kpi-lbl">ใกล้เต็มงบ &gt;80%</div><div class="kpi-v">${over80}</div><div class="kpi-s">โครงการ</div></div>
    <div class="kpi c-teal"><div class="kpi-lbl">ใช้น้อย &lt;20%</div><div class="kpi-v">${under20}</div><div class="kpi-s">โครงการ</div></div>
    <div class="kpi c-purple"><div class="kpi-lbl">โครงการที่แสดง</div><div class="kpi-v">${data.length}</div><div class="kpi-s">จาก ${BUDGET_DATA.length} โครงการ</div></div>
    <div class="kpi" style="border-top:3px solid #e67e22;overflow:hidden;position:relative"><div class="kpi-lbl">งบดำเนินงาน (เบิกแล้ว)</div><div class="kpi-v" style="color:#e67e22">${fmt(opTotal)}</div><div class="kpi-s">${fmtF(opTotal)} บาท</div></div>
  </div>`;
  if(activeTab===0)renderOverview(kpiHtml,data);
  else if(activeTab===1)renderProjects(kpiHtml,data);
  else if(activeTab===2)renderTrend(kpiHtml,data);
  else if(activeTab===3)renderOpBudget(kpiHtml);
}

    </div>`;
  });
  document.getElementById('app').innerHTML=kpiHtml+`<div class="proj-grid">${cards}</div>${data.length===0?'<div class="no-data">ไม่มีโครงการที่ตรงกับเงื่อนไข</div>':''}`;
}

function renderTrend(kpiHtml,data){
  const monthAll={};
  data.forEach(p=>{Object.entries(p.months||{}).forEach(([mk,v])=>{if(!monthAll[mk])monthAll[mk]=0;monthAll[mk]+=v;});});
  const monthDiv={};
  allTx.forEach(tx=>{
    if(!tx.monthKey||tx.disb<=0)return;
    // filter bar ถูกลบแล้ว - trend แสดงข้อมูลทั้งหมด
    if(!monthDiv[tx.div])monthDiv[tx.div]={};
    if(!monthDiv[tx.div][tx.monthKey])monthDiv[tx.div][tx.monthKey]=0;
    monthDiv[tx.div][tx.monthKey]+=tx.disb;
  });
  const allKeys=[...new Set([...Object.keys(monthAll),...Object.values(monthDiv).flatMap(v=>Object.keys(v))])].sort();
  const labels=allKeys.map(mkLbl);
  let cum=0;const cumVals=allKeys.map(mk=>{cum+=(monthAll[mk]||0);return cum;});
  document.getElementById('app').innerHTML=kpiHtml+`
  <div class="g2">
    <div class="card"><div class="card-hd">ยอดเบิกจ่ายรายเดือน</div><div class="chart-wrap" style="height:260px"><canvas id="barChart"></canvas></div></div>
    <div class="card"><div class="card-hd">ยอดเบิกจ่ายสะสม</div><div class="chart-wrap" style="height:260px"><canvas id="cumulChart"></canvas></div></div>
  </div>
  <div class="card"><div class="card-hd">ยอดเบิกจ่ายรายเดือนแยกตามสาขา</div><div class="chart-wrap" style="height:280px"><canvas id="stackChart"></canvas></div></div>`;
  kc('barChart');
  charts['barChart']=new Chart(document.getElementById('barChart'),{type:'bar',data:{labels,datasets:[{label:'เบิกจ่าย',data:allKeys.map(mk=>monthAll[mk]||0),backgroundColor:'#2563eb',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'฿'+Math.round(c.raw).toLocaleString('th-TH')}}},scales:{x:{grid:{display:false},ticks:{font:{size:10,family:'Sarabun'}}},y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10,family:'Sarabun'},callback:v=>fmt(v)}}}}});
  kc('cumulChart');
  charts['cumulChart']=new Chart(document.getElementById('cumulChart'),{type:'line',data:{labels,datasets:[{label:'สะสม',data:cumVals,borderColor:'#7c3aed',backgroundColor:'rgba(124,58,237,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:3,pointBackgroundColor:'#7c3aed'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'฿'+Math.round(c.raw).toLocaleString('th-TH')}}},scales:{x:{grid:{display:false},ticks:{font:{size:10,family:'Sarabun'}}},y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10,family:'Sarabun'},callback:v=>fmt(v)}}}}});
  kc('stackChart');
  const ds=Object.entries(monthDiv).map(([d,mv])=>({label:d,data:allKeys.map(mk=>mv[mk]||0),backgroundColor:(DC[d]||'#6b7280')+'cc',borderRadius:3}));
  charts['stackChart']=new Chart(document.getElementById('stackChart'),{type:'bar',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Sarabun',size:11},padding:12}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ฿${Math.round(c.raw).toLocaleString('th-TH')}`}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10,family:'Sarabun'}}},y:{stacked:true,grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10,family:'Sarabun'},callback:v=>fmt(v)}}}}});
}

/* ---- Detail Panel ---- */
// filterDiv = สาขาที่ต้องการเปิดตรงๆ (optional)
function openDetail(code, filterDiv){
  const p=BUDGET_DATA.find(x=>x.code===code);if(!p)return;
  const act=projActual[code]||{total:0,appr:0,divs:{},months:{}};
  const clr=pctClr(pct(act.total,p.budget));

  // สร้าง div tabs
  const divKeys=Object.keys(p.divs_budget||{});
  let activeDivTab=filterDiv&&divKeys.includes(filterDiv)?filterDiv:'';

  function renderPanel(){
    // progress bars per div
    // รวมทั้งสาขาที่มีงบตั้งไว้ และสาขาที่เบิกโดยไม่มีงบตั้งไว้
    const allDivsInPanel=new Set([...divKeys,...Object.keys(act.divs||{}).filter(d=>VALID_DIVS.has(d))]);
    let divRows='';
    [...allDivsInPanel].sort().forEach(d=>{
      const b=p.divs_budget[d]||0;
      const da=act.divs[d]?act.divs[d].disb:0;
      if(b===0&&da===0)return; // ข้ามถ้าทั้งคู่เป็น 0
      const hasNoBudget=b===0&&da>0; // เบิกแล้วแต่ไม่มีงบตั้งไว้
      const dp=b>0?pct(da,b):0;
      const c=DC[d]||'#6b7280';
      const isActive=activeDivTab===d;
      divRows+=`<div class="dp-div-row" style="${isActive?'background:#eff6ff;border:1px solid '+c+'40':''}" onclick="panelSetDiv('${code}','${d}')">
        <div class="dp-div-dot" style="background:${c}"></div>
        <div class="dp-div-name" style="color:${isActive?c:'inherit'}">${d}${hasNoBudget?'<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:6px;margin-left:5px;font-weight:600">ไม่มีงบตั้งไว้</span>':''}</div>
        ${b>0
          ?`<div class="dp-div-bar"><div class="dp-div-fill" style="width:${Math.min(dp,100)}%;background:${c}"></div></div>
            <div class="dp-div-pct" style="color:${pctClr(dp)}">${dp}%</div>
            <div class="dp-div-amt">${fmtF(da)}/${fmtF(b)}</div>`
          :`<div class="dp-div-bar" style="background:#fef3c7"><div class="dp-div-fill" style="width:100%;background:${c}99;background:repeating-linear-gradient(45deg,${c}33,${c}33 4px,${c}66 4px,${c}66 8px)"></div></div>
            <div class="dp-div-pct" style="color:#92400e">+${fmtF(da)}</div>
            <div class="dp-div-amt" style="color:#92400e">เบิก ${fmtF(da)}</div>`
        }
        <div class="dp-div-arrow" style="color:${c}">&#8594;</div>
      </div>`;
    });

    // Transaction table
    let txList=allTx.filter(t=>t.code===code&&t.disb>0);
    if(activeDivTab) txList=txList.filter(t=>t.div===activeDivTab);
    txList.sort((a,b)=>{
      if(a.monthKey&&b.monthKey)return b.monthKey.localeCompare(a.monthKey);
      return b.disb-a.disb;
    });
    const txTotal=txList.reduce((s,t)=>s+t.disb,0);
    let txRows='';
    txList.forEach(t=>{
      const c=DC[t.div]||'#6b7280';
      txRows+=`<tr>
        <td class="tx-date">${t.date||'-'}</td>
        <td><span class="tx-div-badge" style="background:${c}18;color:${c}">${t.div||'-'}</span></td>
        <td class="tx-desc" title="${t.desc}">${t.desc.length>45?t.desc.slice(0,45)+'…':t.desc}</td>
        <td style="font-size:11px;color:var(--muted);white-space:nowrap">${t.owner||'-'}</td>
        <td class="tx-amt">${fmtF(t.disb)}</td>
      </tr>`;
    });
    if(txList.length>0){
      txRows+=`<tr class="tx-total-row"><td colspan="4" style="text-align:right;padding:7px 8px">รวมทั้งหมด (${txList.length} รายการ)</td><td class="tx-amt">${fmtF(txTotal)}</td></tr>`;
    }

    // Mini monthly chart data
    const mMonths=act.months||{};
    let chartMonths=mMonths;
    if(activeDivTab){
      // กรองเฉพาะสาขานั้น
      const divMon={};
      allTx.filter(t=>t.code===code&&t.div===activeDivTab&&t.disb>0&&t.monthKey).forEach(t=>{
        if(!divMon[t.monthKey])divMon[t.monthKey]=0;
        divMon[t.monthKey]+=t.disb;
      });
      chartMonths=divMon;
    }
    const mKeys=Object.keys(chartMonths).sort();

    document.getElementById('dp-title').textContent='รายละเอียด: '+code+(activeDivTab?' | สาขา'+activeDivTab:'');
    document.getElementById('dp-body').innerHTML=`
      <div class="dp-code">${code}</div>
      <div class="dp-name">${p.name}</div>
      ${p.owner?`<div style="font-size:11px;color:var(--muted);margin-bottom:10px">&#128100; ผู้รับผิดชอบ: ${p.owner}</div>`:''}
      <div class="dp-kpis">
        <div class="dp-kpi"><div class="dp-kpi-lbl">งบตั้งไว้${activeDivTab?' ('+activeDivTab+')':''}</div><div class="dp-kpi-val" style="color:var(--blue)">${activeDivTab?fmtF(p.divs_budget[activeDivTab]||0):fmtF(p.budget)}</div></div>
        <div class="dp-kpi"><div class="dp-kpi-lbl">เบิกแล้ว${activeDivTab?' ('+activeDivTab+')':''}</div><div class="dp-kpi-val" style="color:${clr}">${activeDivTab?fmtF(act.divs[activeDivTab]?act.divs[activeDivTab].disb:0):fmtF(act.total)}</div></div>
        <div class="dp-kpi"><div class="dp-kpi-lbl">คงเหลือ</div><div class="dp-kpi-val" style="color:var(--muted)">${activeDivTab?fmtF((p.divs_budget[activeDivTab]||0)-(act.divs[activeDivTab]?act.divs[activeDivTab].disb:0)):fmtF(p.budget-act.total)}</div></div>
      </div>
      <div style="margin-bottom:14px">
        <div style="height:14px;background:#f3f4f6;border-radius:7px;overflow:hidden;margin-bottom:3px">
          <div style="height:100%;width:${Math.min(pct(act.total,p.budget),100)}%;background:${clr};border-radius:7px"></div>
        </div>
        <div style="font-size:11px;font-weight:700;text-align:right;color:${clr}">${pct(act.total,p.budget)}% ของงบทั้งโครงการ</div>
      </div>
      <div class="dp-section">
        <div class="dp-sec-title">
          แยกตามสาขา <span style="font-size:10px;font-weight:400;color:var(--muted)">คลิกเพื่อดูรายการของสาขานั้น</span>
          ${activeDivTab?`<button onclick="panelSetDiv('${code}','')" style="font-family:Sarabun,sans-serif;font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);background:#f9fafb;cursor:pointer;color:var(--muted)">ดูทั้งหมด</button>`:''}
        </div>
        ${divRows}
      </div>
      ${mKeys.length?`<div class="dp-section"><div class="dp-sec-title">แนวโน้มรายเดือน${activeDivTab?' ('+activeDivTab+')':''}</div><div style="position:relative;height:150px"><canvas id="miniChart"></canvas></div></div>`:''}
      <div class="dp-section">
        <div class="dp-sec-title">
          รายการเบิกจ่าย${activeDivTab?' — สาขา '+activeDivTab:' (ทุกสาขา)'}
          <span style="font-size:10px;font-weight:400;color:var(--muted)">${txList.length} รายการ</span>
        </div>
        ${txRows?`<div style="overflow-x:auto;max-height:400px;overflow-y:auto"><table class="tx-table"><thead><tr><th>วันที่</th><th>สาขา</th><th>รายละเอียด</th><th>เจ้าของเรื่อง</th><th style="text-align:right">จำนวน (บาท)</th></tr></thead><tbody>${txRows}</tbody></table></div>`:'<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">ยังไม่มีรายการเบิกจ่าย</div>'}
      </div>`;

    if(mKeys.length){
      kc('miniChart');
      const activeColor=activeDivTab?DC[activeDivTab]||'#2563eb':'#2563eb';
      charts['miniChart']=new Chart(document.getElementById('miniChart'),{type:'bar',data:{labels:mKeys.map(mkLbl),datasets:[{data:mKeys.map(mk=>chartMonths[mk]||0),backgroundColor:activeColor,borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'฿'+Math.round(c.raw).toLocaleString('th-TH')}}},scales:{x:{grid:{display:false},ticks:{font:{size:10,family:'Sarabun'}}},y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10,family:'Sarabun'},callback:v=>fmt(v)}}}}});
    }
  }

  // เปิด panel
  window.panelSetDiv=function(c,d){
    activeDivTab=d;kc('miniChart');renderPanel();
  };
  renderPanel();
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  kc('miniChart');
}

buildCodeFilter();
loadSheets();
setInterval(loadSheets,300000);
</script>
</body>
</html>
