<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard งบประมาณ คณะเทคโนโลยี มข. 2569</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--blue:#2563eb;--green:#059669;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;--teal:#0891b2}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#16213e,#0f3460 60%,#533483);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;font-weight:700;color:#fff}
.header p{font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px}
.btn{font-family:'Sarabun',sans-serif;padding:7px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.12);color:#fff;font-size:13px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,0.22)}
.lupd{font-size:12px;color:rgba(255,255,255,0.5);margin-right:8px}
.sdot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.filter-bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-bar label{font-size:12px;font-weight:600;color:var(--muted)}
select.fsel{font-family:'Sarabun',sans-serif;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer}
.btn-sm{font-family:'Sarabun',sans-serif;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:#f9fafb;color:var(--muted);cursor:pointer}
.count-badge{font-size:12px;color:var(--blue);background:#eff6ff;padding:3px 10px;border-radius:20px;font-weight:500}
.main{padding:20px 28px;max-width:1400px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.07)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}
.kpi.orange::before{background:var(--orange)}.kpi.purple::before{background:var(--purple)}
.kpi.red::before{background:var(--red)}.kpi.teal::before{background:var(--teal)}
.kpi-label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.kpi-val{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;margin-top:4px}
.pg{background:#d1fae5;color:#065f46}.pw{background:#fef3c7;color:#92400e}.pr{background:#fee2e2;color:#991b1b}
.card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--blue);display:block;flex-shrink:0}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;white-space:nowrap}
th:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid #f9fafb;text-align:right}
td:first-child{text-align:left;font-weight:600}
tr:hover td{background:#fafafa}
tr:last-child td{border-bottom:none}
.tr-total td{font-weight:700;background:#f0f7ff;border-top:2px solid var(--border);color:var(--blue)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
@media(max-width:700px){.proj-grid{grid-template-columns:1fr}}
.proj-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:14px 16px;border-left:4px solid;transition:box-shadow .15s}
.proj-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.08)}
.pc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.pc-code{font-size:14px;font-weight:700;color:var(--blue)}
.pc-tier{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tier-1{background:#ede9fe;color:#5b21b6}.tier-2{background:#dbeafe;color:#1e40af}.tier-p{background:#d1fae5;color:#065f46}
.pc-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:3px}
.pc-owner{font-size:11px;color:var(--muted);margin-bottom:10px}
.pc-amounts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.pc-amt{font-size:11px;background:#f9fafb;border-radius:6px;padding:6px 8px}
.pc-amt-label{color:var(--muted);display:block;margin-bottom:2px}
.pc-amt-val{font-weight:700;font-size:12px}
.prog-track{height:14px;background:#f3f4f6;border-radius:7px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;border-radius:7px;transition:width .6s ease}
.prog-pct{font-size:12px;font-weight:700;text-align:right}
.pc-divs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6}
.div-chip{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}
.loading{text-align:center;padding:50px;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px;color:#991b1b;font-size:13px;margin-bottom:16px}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:4px}
</style>
</head>

  <button class="btn-sm" onclick="clearFilters()">&#10005; ล้างตัวกรอง</button>
  <span class="count-badge" id="count-badge"></span>
</div>

<div class="main">

</div>

let projActual={};

function n(v){return parseFloat((v||'').toString().replace(/,/g,''))||0;}
function fmt(v){if(!v||isNaN(v))return'0';if(Math.abs(v)>=1000000)return(v/1000000).toFixed(2)+'M';if(Math.abs(v)>=1000)return(v/1000).toFixed(0)+'K';return Math.round(v).toLocaleString('th-TH');}
function fmtF(v){return v?Math.round(v).toLocaleString('th-TH'):'0';}
function pct(a,b){return b>0?Math.min(Math.round(a/b*100),999):0;}
function pctCls(p){return p>=80?'pr':p>=50?'pw':'pg';}
function pctClr(p){return p>=80?'#dc2626':p>=50?'#d97706':'#059669';}

function buildCodeFilter(){
  const fc=document.getElementById('fCode');
  const cur=fc.value;
  fc.innerHTML='<option value="">&#8212; ทุกโครงการ &#8212;</option>';
  BUDGET_DATA.forEach(p=>{
    const o=document.createElement('option');
    o.value=p.code;
    const nm=p.name.length>30?p.name.slice(0,30)+'…':p.name;
    o.textContent=p.code+' - '+nm;
    fc.appendChild(o);
  });
  if(cur)fc.value=cur;
}

function clearFilters(){
  ['fCode','fDiv','fAlert'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fSort').value='code';
  renderAll();
}

function parseCSV(txt){
  return txt.split('\n').map(l=>{
    const c=[];let cur='';let inQ=false;
    for(let i=0;i<l.length;i++){
      if(l[i]==='"'){inQ=!inQ;}
      else if(l[i]===','&&!inQ){c.push(cur.trim());cur='';}
      else cur+=l[i];
    }
    c.push(cur.trim());return c;
  }).filter(r=>r.length>1);
}

async function loadSheets(){
  document.getElementById('lupd').textContent='กำลังโหลด...';
  try{
    const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID_PROJ+'&t='+Date.now();
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=parseCSV(await r.text());
    projActual={};
    rows.slice(1).forEach(r=>{
      if(!r[0]||!r[0].trim())return;
      const rawCode=(r[0]||'').trim();
      const code=rawCode.split(' ')[0].replace(/-\d+$/,'');
      const disb=n(r[10]);
      if(!projActual[code])projActual[code]={total:0,divs:{}};
      projActual[code].total+=disb;
      const div=(r[2]||'').trim();
      if(div){
        if(!projActual[code].divs[div])projActual[code].divs[div]=0;
        projActual[code].divs[div]+=disb;
      }
    });
    document.getElementById('lupd').textContent='อัพเดต '+new Date().toLocaleTimeString('th-TH');
    buildCodeFilter();
    renderAll();
  }catch(e){
    document.getElementById('lupd').textContent='โหลดไม่สำเร็จ';
    document.getElementById('app').innerHTML='<div class="err"><strong>ไม่สามารถดึงข้อมูลได้:</strong> '+e.message+'<br><small>ตรวจสอบว่า Google Sheets เปิดการแชร์ Anyone with the link แล้ว</small></div>';
  }
}

function renderAll(){
  const fCode=document.getElementById('fCode').value;
  const fDiv=document.getElementById('fDiv').value;
  const fAlert=document.getElementById('fAlert').value;
  const fSort=document.getElementById('fSort').value;

  let data=BUDGET_DATA.map(p=>{
    const act=projActual[p.code]||{total:0,divs:{}};
    let budget=p.budget,actual=act.total;
    if(fDiv){budget=p.divs_budget[fDiv]||0;actual=act.divs[fDiv]||0;}
    return{...p,showBudget:budget,showActual:actual,usePct:pct(actual,budget),divsActual:act.divs};
  });

  if(fCode)data=data.filter(p=>p.code===fCode);
  if(fDiv)data=data.filter(p=>p.showBudget>0);
  if(fAlert==='over80')data=data.filter(p=>p.usePct>=80);
  else if(fAlert==='over50')data=data.filter(p=>p.usePct>=50);
  else if(fAlert==='under20')data=data.filter(p=>p.usePct<20&&p.showBudget>0);

  if(fSort==='code')data.sort((a,b)=>a.code.localeCompare(b.code));
  else if(fSort==='pct-desc')data.sort((a,b)=>b.usePct-a.usePct);
  else if(fSort==='pct-asc')data.sort((a,b)=>a.usePct-b.usePct);
  else if(fSort==='budget-desc')data.sort((a,b)=>b.showBudget-a.showBudget);
  else if(fSort==='actual-desc')data.sort((a,b)=>b.showActual-a.showActual);

  const totalBudget=data.reduce((s,p)=>s+p.showBudget,0);
  const totalActual=data.reduce((s,p)=>s+p.showActual,0);
  const over80=data.filter(p=>p.usePct>=80).length;
  const under20=data.filter(p=>p.usePct<20&&p.showBudget>0).length;
  const totalP=pct(totalActual,totalBudget);

  document.getElementById('count-badge').textContent=data.length+' โครงการ';

  const divSum={};
  BUDGET_DATA.forEach(p=>{Object.entries(p.divs_budget||{}).forEach(([d,b])=>{if(!divSum[d])divSum[d]={b:0,a:0};divSum[d].b+=b;});});
  Object.entries(projActual).forEach(([code,v])=>{Object.entries(v.divs||{}).forEach(([d,a])=>{if(!divSum[d])divSum[d]={b:0,a:0};divSum[d].a+=a;});});

  let divRows='';
  let sumB=0,sumA=0;
  Object.entries(divSum).forEach(([d,v])=>{
    const p2=pct(v.a,v.b);const c=DIV_COLORS[d]||'#6b7280';
    sumB+=v.b;sumA+=v.a;
    divRows+=`<tr><td style="text-align:left"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:6px;vertical-align:middle"></span>${d}</td><td>${fmtF(v.b)}</td><td style="color:${pctClr(p2)};font-weight:600">${fmtF(v.a)}</td><td style="color:var(--muted)">${fmtF(v.b-v.a)}</td><td><span class="pill ${pctCls(p2)}">${p2}%</span></td><td><div style="height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden"><div style="height:100%;width:${p2}%;background:${c};border-radius:4px"></div></div></td></tr>`;
  });
  const sumP=pct(sumA,sumB);
  divRows+=`<tr class="tr-total"><td style="text-align:left">รวมทั้งหมด</td><td>${fmtF(sumB)}</td><td>${fmtF(sumA)}</td><td>${fmtF(sumB-sumA)}</td><td><span class="pill ${pctCls(sumP)}">${sumP}%</span></td><td></td></tr>`;

  let projCards='';
  data.forEach(p=>{
    const clr=pctClr(p.usePct);
    const tierCls=TIER_MAP[p.tier]||'';
    const tierBadge=p.tier&&tierCls?`<span class="pc-tier ${tierCls}">${p.tier}</span>`:'';
    const ownerRow=p.owner?`<div class="pc-owner">&#128100; ${p.owner}</div>`:'';
    let divChips='';
    Object.entries(p.divs_budget||{}).forEach(([d,b])=>{
      const da=p.divsActual?p.divsActual[d]||0:0;
      const dp=pct(da,b);const dc=DIV_COLORS[d]||'#6b7280';
      divChips+=`<span class="div-chip" style="background:${dc}18;color:${dc}">${d}: ${fmtF(da)}/${fmtF(b)} (${dp}%)</span>`;
    });
    projCards+=`<div class="proj-card" style="border-left-color:${clr}">
      <div class="pc-header"><div><div class="pc-code">${p.code}</div><div class="pc-name">${p.name}</div>${ownerRow}</div>${tierBadge}</div>
      <div class="pc-amounts">
        <div class="pc-amt"><span class="pc-amt-label">งบตั้งไว้</span><span class="pc-amt-val">${fmtF(p.showBudget)}</span></div>
        <div class="pc-amt"><span class="pc-amt-label">เบิกแล้ว</span><span class="pc-amt-val" style="color:${clr}">${fmtF(p.showActual)}</span></div>
        <div class="pc-amt"><span class="pc-amt-label">คงเหลือ</span><span class="pc-amt-val" style="color:var(--muted)">${fmtF(p.showBudget-p.showActual)}</span></div>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${Math.min(p.usePct,100)}%;background:${clr}"></div></div>
      <div class="prog-pct" style="color:${clr}">${p.usePct}% ของงบที่ตั้งไว้</div>
      <div class="pc-divs">${divChips}</div>
    </div>`;
  });

  document.getElementById('app').innerHTML=`
  <div class="kpi-grid">
    <div class="kpi blue"><div class="kpi-label">งบตั้งไว้รวม (แผน 2569)</div><div class="kpi-val">${fmt(totalBudget)}</div><div class="kpi-sub">${fmtF(totalBudget)} บาท</div></div>
    <div class="kpi green"><div class="kpi-label">เบิกจ่ายแล้ว</div><div class="kpi-val">${fmt(totalActual)}</div><span class="pill ${pctCls(totalP)}">${totalP}% ของงบ</span></div>
    <div class="kpi orange"><div class="kpi-label">คงเหลือ</div><div class="kpi-val">${fmt(totalBudget-totalActual)}</div><div class="kpi-sub">${fmtF(totalBudget-totalActual)} บาท</div></div>
    <div class="kpi red"><div class="kpi-label">ใกล้เต็มงบ (&gt;80%)</div><div class="kpi-val">${over80}</div><div class="kpi-sub">โครงการ</div></div>
    <div class="kpi teal"><div class="kpi-label">ยังใช้น้อย (&lt;20%)</div><div class="kpi-val">${under20}</div><div class="kpi-sub">โครงการ</div></div>
    <div class="kpi purple"><div class="kpi-label">โครงการทั้งหมด</div><div class="kpi-val">${data.length}</div><div class="kpi-sub">โครงการ</div></div>
  </div>
  <div class="card">
    <div class="card-title">สรุปการใช้งบแยกตามสาขา</div>
    <div class="twrap"><table><thead><tr><th style="text-align:left">สาขา</th><th>งบตั้งไว้ (บาท)</th><th>เบิกแล้ว (บาท)</th><th>คงเหลือ (บาท)</th><th>% ใช้งบ</th><th style="min-width:120px">ความคืบหน้า</th></tr></thead><tbody>${divRows}</tbody></table></div>
  </div>
  <div class="card">
    <div class="card-title">รายละเอียดแต่ละโครงการ <span style="font-size:12px;font-weight:400;color:var(--muted)">${data.length} โครงการ</span></div>
    ${data.length===0?'<div class="no-data">ไม่มีโครงการที่ตรงกับเงื่อนไข</div>':''}
    <div class="proj-grid">${projCards}</div>
  </div>`;
}

buildCodeFilter();
loadSheets();
setInterval(loadSheets,300000);
</script>
</body>
</html>
